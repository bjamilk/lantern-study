name: Deploy production

# Post-merge production deploy for the web app (Cloudflare Pages).
# API production remains a separate manual/script step (or run the optional job).
# See docs/deploy/05-ci-cd-pipeline.md

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_api:
        description: 'Also deploy Render production API + worker'
        type: boolean
        default: false

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy-web:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web (production)
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
        run: |
          npm run build --workspace=@lantern/shared
          npx turbo run build --filter=@lantern/web --force

      - name: Deploy Cloudflare Pages (main)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx wrangler pages deploy dist \
            --project-name=lantern-study \
            --branch=main \
            --commit-dirty=true \
            --commit-hash="${{ github.sha }}" \
            --commit-message="prod ${{ github.sha }}"

      - name: Smoke production URL
        env:
          PRODUCTION_WEB_URL: ${{ vars.PRODUCTION_WEB_URL }}
        run: |
          set -euo pipefail
          URL="${PRODUCTION_WEB_URL:-https://lanternstudy.com}"
          for i in 1 2 3 4 5 6; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' "$URL/" || echo 000)
            echo "attempt $i: HTTP $code"
            if [ "$code" = "200" ]; then exit 0; fi
            sleep 10
          done
          echo "Production smoke failed for $URL"
          exit 1

  deploy-api:
    if: github.event_name == 'workflow_dispatch' && inputs.deploy_api == true
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Deploy Render production API
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          GOTENBERG_URL: ${{ vars.GOTENBERG_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $gotenberg = if ($env:GOTENBERG_URL) { $env:GOTENBERG_URL } else { 'https://lantern-study-gotenberg.onrender.com' }
          @"
          SUPABASE_SERVICE_ROLE_KEY=$($env:SUPABASE_SERVICE_ROLE_KEY)
          SUPABASE_ANON_KEY=$($env:SUPABASE_ANON_KEY)
          GROQ_API_KEY=$($env:GROQ_API_KEY)
          REDIS_URL=$($env:REDIS_URL)
          GOTENBERG_URL=$gotenberg
          JWT_SECRET=$($env:JWT_SECRET)
          "@ | Set-Content -Path apps/api-server/.env
          .\scripts\deploy-render-api.ps1
