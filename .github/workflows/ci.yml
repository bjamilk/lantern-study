name: CI

on:
  push:
    branches: [main, master]
  pull_request:

# Supersede in-flight runs of the same branch/PR — a newer push makes the older
# run's verdict irrelevant, so cancel it instead of queueing behind it.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Security overrides are actually installed
        run: node scripts/check-overrides.mjs
      - run: npm run lint --workspace=@lantern/api-server --if-present
      - run: npm run build --workspace=@lantern/shared
      - run: npm run build --workspace=@lantern/api-server
      - run: npm run build:web
      - run: npm run typecheck --workspace=@lantern/api-server --if-present
      - run: npm run typecheck --workspace=@lantern/web --if-present
      - run: node scripts/migrate-design-tokens.mjs --check

  feature-registry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Needs the base commit to diff against; the default shallow clone
          # has only one, and the script skips rather than fails without it.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: A mobile release must touch the admin feature registry
        # Admin -> Features is hand-maintained and support reads it as the
        # record of what shipped. It fell a month behind once; this catches the
        # next time. [skip registry] in a commit message opts a no-op bump out.
        env:
          REGISTRY_CHECK_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/check-feature-registry.mjs

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Scan for committed secrets
        run: bash scripts/check-secrets.sh

  security-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: npm audit (high severity, curated allowlist)
        # Fails on any high/critical advisory NOT listed in
        # scripts/audit-allowlist.json. Each allowlisted GHSA id documents the
        # forbidden major upgrade (e.g. expo@57) that would unblock it.
        run: node scripts/check-audit.mjs

  api-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run build --workspace=@lantern/shared
      - run: npm test --workspace=@lantern/api-server --if-present

  mobile-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm test --workspace=@lantern/mobile

  web-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run build --workspace=@lantern/shared
      - run: npm test --workspace=@lantern/web
