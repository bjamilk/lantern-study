name: Deploy API (Render)

# This workflow is now THE door to the production API.
#
# It used to be workflow_dispatch-only while Render auto-deployed from main on
# its own git hook, which meant the gates written below guarded nothing: the API
# shipped straight from the branch with zero checks. `autoDeploy: false` on the
# API and worker services in render.yaml closes that side door — after applying
# the blueprint (or flipping Auto-Deploy to "No" in the Render dashboard for
# lantern-study-api and lantern-study-worker), this workflow is the only path.
#
# Gate order is the same as deploy-web.yml and for the same reasons:
#   1. `provenance` — the commit must have come from a merged PR.
#   2. `ci` — the full CI workflow, called reusably so the deploy job's `needs:`
#      edge makes "deploy never runs on red CI" a property of the graph.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch, tag or SHA to deploy'
        required: false
        default: 'main'

concurrency:
  group: deploy-api
  cancel-in-progress: false

env:
  RENDER_SERVICE_NAME: lantern-study-api

jobs:
  provenance:
    name: provenance (came from a merged PR)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Commit must come from a merged pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          sha=$(git rev-parse HEAD)
          node scripts/check-merge-provenance.mjs --sha "$sha"

  ci:
    name: ci
    needs: provenance
    uses: ./.github/workflows/ci.yml

  deploy:
    name: deploy
    needs: [provenance, ci]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      # Render builds the Docker image itself, but a failed image build silently
      # leaves the previous version serving — so a broken commit looks "fine" from
      # outside. Compile and test here first so that cannot happen unnoticed.
      - name: Security overrides are actually installed
        run: node scripts/check-overrides.mjs

      - run: npm run build --workspace=@lantern/shared
      - run: npm run build --workspace=@lantern/api-server
      - run: npm test --workspace=@lantern/api-server

      - name: Trigger Render deploy and wait
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          set -euo pipefail
          api() { curl -fsS -H "Authorization: Bearer $RENDER_API_KEY" -H 'Accept: application/json' "$@"; }

          # The list endpoint wraps each entry as {"service": {...}}; `// .` falls back
          # to the bare object in case that ever changes.
          service_id=$(api "https://api.render.com/v1/services?name=${RENDER_SERVICE_NAME}&limit=20" \
            | jq -r --arg n "$RENDER_SERVICE_NAME" '[.[] | (.service // .) | select(.name == $n)][0].id // empty')
          if [ -z "$service_id" ]; then
            echo "::error::No Render service named ${RENDER_SERVICE_NAME} is visible to this API key."
            exit 1
          fi
          echo "service: $service_id"

          deploy_id=$(curl -fsS -X POST \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H 'Content-Type: application/json' \
            -d '{"clearCache":"do_not_clear"}' \
            "https://api.render.com/v1/services/$service_id/deploys" \
            | jq -r '.id')
          echo "deploy: $deploy_id"

          # Poll rather than fire-and-forget: Render keeps the last good deploy live
          # when a new one fails, so /health stays 200 and hides the failure.
          for i in $(seq 1 80); do
            status=$(api "https://api.render.com/v1/services/$service_id/deploys/$deploy_id" | jq -r '.status // empty')
            echo "[$i] $status"
            case "$status" in
              live) echo "deploy live"; exit 0;;
              build_failed|update_failed|canceled|pre_deploy_failed)
                echo "::error::Render deploy finished as '$status'. Check the Render dashboard build log."
                exit 1;;
            esac
            sleep 15
          done
          echo "::error::Timed out waiting for the Render deploy to go live."
          exit 1

      # /health stamps the deployed commit. Comparing it against the commit we
      # deployed is the only proof the new image is the one serving — a 200 alone
      # is satisfied by the PREVIOUS image when a deploy fails.
      - name: Health check and commit marker
        run: |
          set -euo pipefail
          expected=$(git rev-parse --short=7 HEAD)
          echo "expecting /health commit: $expected"
          for i in $(seq 1 20); do
            body=$(curl -fsS https://lantern-study-api.onrender.com/health || true)
            live=$(echo "$body" | jq -r '.commit // empty' 2>/dev/null || true)
            echo "attempt $i: commit=$live"
            if [ "$live" = "$expected" ]; then echo "API healthy on $live"; exit 0; fi
            sleep 10
          done
          echo "::error::API /health never reported commit $expected. The old image may still be serving."
          exit 1
