name: Admin API Smoke

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'apps/api-server/**'
      - 'scripts/admin-smoke.ps1'
      - 'components/admin/**'
      - 'services/admin.ts'

jobs:
  admin-smoke:
    runs-on: windows-latest
    if: ${{ vars.RUN_ADMIN_SMOKE == 'true' }}
    steps:
      - uses: actions/checkout@v7
      - name: Run admin smoke test
        shell: pwsh
        run: |
          if (-not $env:SUPABASE_URL) { Write-Host 'Skipping: SUPABASE_URL not configured'; exit 0 }
          ./scripts/admin-smoke.ps1 -CleanupUsers $true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          API_BASE_URL: ${{ vars.API_BASE_URL || 'http://127.0.0.1:3001' }}
