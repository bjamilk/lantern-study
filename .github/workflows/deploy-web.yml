name: Deploy web (Cloudflare Pages)

# Auto-deploys the web app to lanternstudy.com on every push to main (e.g. a merged
# PR), and can still be run on demand via workflow_dispatch for a specific ref.
# The build/verify/publish steps below are the safety net that makes auto-deploy
# safe: they refuse to publish a bundle that does not build or that points at a
# non-production Supabase. To go back to manual-only, delete the `push:` trigger.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch, tag or SHA to deploy'
        required: false
        default: 'main'

concurrency:
  group: deploy-web
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || 'main' }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      # Cheap correctness gates first — never publish a tree that cannot build.
      - name: Security overrides are actually installed
        run: node scripts/check-overrides.mjs

      - name: Scan for committed secrets
        run: bash scripts/check-secrets.sh

      - name: Build web
        env:
          # Vite inlines these at build time. Supplying them here — rather than from
          # whatever .env happens to sit on a laptop — is the entire point of this
          # workflow: a locally built dist once shipped local dev values to
          # production and every login failed with "Invalid API key".
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN }}
        run: npm run build:web

      # Fails the deploy if Vite did not inline the production values, which would
      # otherwise ship a bundle that silently falls back to the demo Supabase key.
      - name: Verify bundle points at production
        run: |
          set -euo pipefail
          url=$(grep -oh '__LANTERN_VITE_SUPABASE_URL__:"[^"]*"' apps/web/dist/assets/index-*.js | head -1 | sed 's/.*:"//;s/"//')
          key=$(grep -oh '__LANTERN_VITE_SUPABASE_ANON_KEY__:"[^"]*"' apps/web/dist/assets/index-*.js | head -1 | sed 's/.*:"//;s/"//')
          if [ -z "$url" ] || [ -z "$key" ]; then
            echo "::error::VITE_SUPABASE_URL / VITE_SUPABASE_ANON_KEY were not inlined. Set them as repository variables."
            exit 1
          fi
          case "$url" in
            *localhost*|*127.0.0.1*|*192.168.*)
              echo "::error::Bundle points at a local Supabase: $url"; exit 1;;
          esac
          issuer=$(python3 -c "import sys,json,base64;p=sys.argv[1].split('.')[1];p+='='*(-len(p)%4);print(json.loads(base64.urlsafe_b64decode(p)).get('iss',''))" "$key")
          if [ "$issuer" != "supabase" ]; then
            echo "::error::Anon key issuer is '$issuer', expected 'supabase'. A demo/dev key is baked into the bundle."
            exit 1
          fi
          echo "url=$url issuer=$issuer"

      # Wrangler compiles ./functions relative to cwd (repo root), not apps/web/dist.
      # A deploy from apps/web ships static assets only: POST /api/v1/auth/refresh
      # then 405s and GET /api returns SPA HTML, which breaks sign-in.
      - name: Publish to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -d functions/api
          npx wrangler pages deploy apps/web/dist --project-name lantern-study --branch main | tee /tmp/wrangler-pages.log
          if ! grep -qiE 'Uploading Functions bundle|Compiled Worker successfully' /tmp/wrangler-pages.log; then
            echo "::error::Pages deploy did not upload Functions. Sign-in will 405 on /api/v1/auth/*."
            exit 1
          fi

      # The build stamps a unique service-worker cache id. Comparing it against the
      # live site is the only reliable proof the deploy actually replaced the old one.
      - name: Confirm the new build is live
        run: |
          set -euo pipefail
          expected=$(grep -oE 'lantern-[a-z0-9]+-[a-z0-9]+' apps/web/dist/sw.js | head -1)
          echo "expected: $expected"
          for i in $(seq 1 20); do
            live=$(curl -fsS https://lanternstudy.com/sw.js | grep -oE 'lantern-[a-z0-9]+-[a-z0-9]+' | head -1 || true)
            if [ "$live" = "$expected" ]; then echo "live: $live — deploy confirmed"; break; fi
            echo "attempt $i: live=$live"; sleep 15
            if [ "$i" -eq 20 ]; then
              echo "::error::Live site never served $expected. Cloudflare may still be propagating, or the deploy did not take."
              exit 1
            fi
          done
          # Same-origin API proxy must be the Pages Function, not the SPA fallback.
          for i in $(seq 1 10); do
            code=$(curl -sS -D /tmp/pages-refresh.hdr -o /tmp/pages-refresh.json -w '%{http_code}' \
              -X POST https://lanternstudy.com/api/v1/auth/refresh \
              -H 'Content-Type: application/json' -d '{}' || true)
            ctype=$(tr -d '\r' < /tmp/pages-refresh.hdr | awk 'tolower($1)=="content-type:"{print $2; exit}')
            echo "attempt $i: refresh HTTP $code content-type=$ctype"
            if [ "$code" != "405" ] && echo "$ctype" | grep -qi '^application/json'; then
              echo "api proxy live: HTTP $code $ctype"
              exit 0
            fi
            sleep 5
          done
          echo "::error::Live /api/v1/auth/refresh is not JSON (last HTTP $code $ctype). Functions were not serving."
          exit 1

      # Tell IndexNow-participating engines (Bing, Yandex, …) the homepage and
      # key landing pages changed. The IndexNow key is a PUBLIC constant
      # (scripts/seo/constants.mjs) served at /lanternstudyindex2026.txt, so no
      # secret is needed; SITE_URL is optional and defaults to lanternstudy.com.
      # Best-effort on purpose: an indexing hiccup must never fail a deploy
      # that is already live. Google is notified via Search Console sitemaps.
      - name: Notify search engines (IndexNow)
        continue-on-error: true
        env:
          SITE_URL: https://lanternstudy.com
        run: npm run seo:notify
