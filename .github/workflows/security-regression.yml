name: Security regression

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  concurrency-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run build --workspace=@lantern/shared
      - name: Challenge + idempotency concurrency tests
        run: >
          npm test --workspace=@lantern/api-server --
          src/services/challengeService.test.ts
          src/services/idempotency.test.ts
          src/utils/concurrencyGate.test.ts

  security-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # THIS STEP FAILS THE JOB when the PoC credentials are missing.
      #
      # It used to set skip=true, warn, and pass green. Every PoC below was
      # skipped on every run for months while "Security regression: passing"
      # sat on the PR page — a green check that asserted nothing, which is
      # worse than no check at all, because people read it and believed it.
      #
      # Green now means the PoCs ran. If this step fails, either add the
      # secrets (docs/PIPELINE.md lists them by name) or delete this job — do
      # not restore the skip.
      - name: Required secrets are configured
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        shell: bash
        run: |
          missing=""
          [ -z "$VITE_SUPABASE_URL" ] && missing="$missing VITE_SUPABASE_URL"
          [ -z "$VITE_SUPABASE_ANON_KEY" ] && missing="$missing VITE_SUPABASE_ANON_KEY"
          [ -z "$SUPABASE_SERVICE_ROLE_KEY" ] && missing="$missing SUPABASE_SERVICE_ROLE_KEY"
          if [ -n "$missing" ]; then
            echo "::error::security-regression cannot run. Missing repository secrets:$missing"
            echo "Point these at a STAGING Supabase project, never production — the service-role key bypasses RLS,"
            echo "and this workflow runs on pull_request. See docs/PIPELINE.md § Secrets."
            exit 1
          fi
          echo "All PoC credentials present."

      # The PoCs build every request as "$SupabaseUrl/rest/v1/..." or
      # "$SupabaseUrl/auth/v1/...", so VITE_SUPABASE_URL must be the project
      # ORIGIN. A secret holding the REST URL (https://<ref>.supabase.co/rest/v1)
      # makes the probe request /rest/v1/rest/v1/ and PostgREST answers 404
      # PGRST125 "Invalid path specified in request URL" -- a path error that
      # says nothing about credentials. Normalise here so one tidy-up fixes all
      # six scripts, and say so, so the secret itself gets tidied too.
      - name: Write ephemeral .env for PoC scripts
        id: write_env
        shell: bash
        env:
          RAW_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
        run: |
          url="$RAW_SUPABASE_URL"
          url="${url%/}"
          for suffix in /rest/v1 /auth/v1 /storage/v1 /realtime/v1 /functions/v1; do
            case "$url" in
              *"$suffix")
                url="${url%$suffix}"
                stripped="$suffix"
                ;;
            esac
          done
          url="${url%/}"
          if [ -n "${stripped:-}" ]; then
            echo "::notice title=VITE_SUPABASE_URL was normalised::The secret ends in '$stripped'. The PoCs append their own service paths, so it was stripped for this run. Please edit the secret to the bare project URL (https://<project-ref>.supabase.co) so the two cannot drift."
          fi
          echo "supabase_url=$url" >> "$GITHUB_OUTPUT"
          cat > .env <<EOF
          VITE_SUPABASE_URL=$url
          VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_API_BASE_URL=${{ secrets.VITE_SUPABASE_API_BASE_URL }}
          EOF
          if [ -n "${{ secrets.VITE_SUPABASE_API_BASE_URL }}" ]; then
            echo "has_api_base=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_api_base=false" >> "$GITHUB_OUTPUT"
          fi
          mkdir -p apps/api-server
          cat > apps/api-server/.env <<EOF
          SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          EOF

      # A wrong VITE_SUPABASE_URL is the failure mode that costs the most time:
      # the Supabase *dashboard* URL (https://supabase.com/dashboard/project/<ref>)
      # answers every /rest/v1 and /auth/v1 call with a 200 HTML page, so all six
      # PoCs die deep inside with "You cannot call a method on a null-valued
      # expression" or "expected denial, got status=200" -- which reads like a
      # real security failure and is not one. Diagnose it once, up front.
      - name: Preflight - VITE_SUPABASE_URL is a Supabase project API URL
        id: preflight
        shell: bash
        env:
          SUPABASE_URL: ${{ steps.write_env.outputs.supabase_url }}
          ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          url="${SUPABASE_URL%/}"
          case "$url" in
            */dashboard*|https://supabase.com*|https://www.supabase.com*)
              echo "::error::VITE_SUPABASE_URL is the Supabase dashboard URL, not the project API URL."
              echo "Use Settings > API > Project URL: https://<project-ref>.supabase.co"
              exit 1
              ;;
          esac
          # What this probe can and cannot conclude:
          #
          #   non-JSON body      -> not PostgREST at all (HTML: dashboard, a
          #                         login redirect, some other app). Wrong host.
          #   JSON body          -> we ARE talking to PostgREST. That is the
          #                         thing being established here, and it holds
          #                         whether the status is 200 (the OpenAPI
          #                         document) or an error. Do not read a status
          #                         code as a verdict on the host.
          #   404 / PGRST125     -> a PATH problem, not a credential one.
          #   401 / 403          -> a KEY problem.
          #
          # The earlier version collapsed the last two into "the anon key is
          # probably wrong", which sent the founder looking at the right secret
          # for the wrong reason.
          code=$(curl -sS -o /tmp/preflight.body -w '%{http_code}' \
            -H "apikey: $ANON_KEY" -H "Authorization: Bearer $ANON_KEY" \
            "$url/rest/v1/" || echo 000)
          first=$(head -c 1 /tmp/preflight.body 2>/dev/null || echo '')
          body=$(head -c 300 /tmp/preflight.body 2>/dev/null || echo '')
          if [ "$first" != "{" ] && [ "$first" != "[" ]; then
            echo "::error::VITE_SUPABASE_URL does not serve PostgREST. GET <url>/rest/v1/ returned HTTP $code with a non-JSON body."
            echo "First 300 bytes of the response (the URL itself is masked as a secret):"
            echo "$body"
            echo "Set VITE_SUPABASE_URL to the STAGING project's API URL: https://<project-ref>.supabase.co"
            exit 1
          fi
          case "$body" in
            *PGRST125*)
              echo "::error::PostgREST returned PGRST125 (Invalid path specified in request URL). VITE_SUPABASE_URL probably includes a service path such as /rest/v1; it must be the bare project URL https://<project-ref>.supabase.co."
              exit 1
              ;;
          esac
          case "$code" in
            2*)
              echo "Preflight OK: the target speaks PostgREST (HTTP $code)."
              ;;
            401|403)
              echo "::error::Reached PostgREST, but GET <url>/rest/v1/ returned HTTP $code. VITE_SUPABASE_ANON_KEY probably does not belong to the project in VITE_SUPABASE_URL."
              echo "$body"
              exit 1
              ;;
            404)
              echo "::error::Reached PostgREST, but GET <url>/rest/v1/ returned HTTP 404 - a path problem, not a credential one. VITE_SUPABASE_URL probably includes a service path (e.g. it ends in /rest/v1), so the request went to /rest/v1/rest/v1/."
              echo "Set the secret to the bare project URL: https://<project-ref>.supabase.co"
              echo "$body"
              exit 1
              ;;
            *)
              echo "::error::Reached PostgREST, but GET <url>/rest/v1/ returned an unexpected HTTP $code."
              echo "$body"
              exit 1
              ;;
          esac

      - name: F-01 marketplace offers PoC
        if: ${{ !cancelled() && steps.write_env.outcome == 'success' && steps.preflight.outcome == 'success' }}
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File ./scripts/poc-f01-marketplace-offers.ps1

      # F-02 is the only PoC that calls the API server: it mints a JWT against
      # VITE_SUPABASE_URL and asks $VITE_API_BASE_URL to sign someone else's
      # private avatar. That host must serve the SAME Supabase project, so it
      # cannot be defaulted — a JWT from one project against another host 401s,
      # and the attacker probe would read as "blocked" while nothing was
      # blocked.
      #
      # So when VITE_SUPABASE_API_BASE_URL is absent this step is SKIPPED, not
      # faked: it prints a ::warning:: annotation and writes a line into the job
      # summary saying, in as many words, that the avatar IDOR is NOT covered by
      # this run. It is never a silent pass. Set the secret and the step runs and
      # enforces again, with no other change. The five PoCs that talk only to
      # PostgREST run either way and still prove what they prove.
      - name: F-02 profile avatar IDOR PoC
        if: ${{ !cancelled() && steps.write_env.outcome == 'success' && steps.preflight.outcome == 'success' && steps.write_env.outputs.has_api_base == 'true' }}
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File ./scripts/poc-f02-profile-avatar-idor.ps1

      - name: F-02 profile avatar IDOR PoC (SKIPPED - no API target)
        if: ${{ !cancelled() && steps.write_env.outcome == 'success' && steps.preflight.outcome == 'success' && steps.write_env.outputs.has_api_base != 'true' }}
        shell: bash
        run: |
          echo "::warning title=F-02 avatar IDOR PoC SKIPPED::VITE_SUPABASE_API_BASE_URL is not set, so the profile-avatar IDOR proof did NOT run. This job being green does not mean F-02 is fixed."
          {
            echo "### :warning: F-02 profile avatar IDOR PoC was SKIPPED"
            echo ""
            echo "\`VITE_SUPABASE_API_BASE_URL\` is not configured, so this run did **not** test the"
            echo "private-avatar IDOR. It is the only PoC that needs a running API server; the other"
            echo "five talk to PostgREST directly and did run."
            echo ""
            echo "To restore coverage, set the \`VITE_SUPABASE_API_BASE_URL\` repository secret to an API"
            echo "server that serves the **same** Supabase project as \`VITE_SUPABASE_URL\`."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Auth-02 marketplace inquiries PoC
        if: ${{ !cancelled() && steps.write_env.outcome == 'success' && steps.preflight.outcome == 'success' }}
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File ./scripts/poc-auth02-marketplace-inquiries.ps1

      - name: RLS privilege battery
        if: ${{ !cancelled() && steps.write_env.outcome == 'success' && steps.preflight.outcome == 'success' }}
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File ./scripts/verify-rls-privileges.ps1

      - name: SEC-01/02/03 Phase 0 RLS PoC
        if: ${{ !cancelled() && steps.write_env.outcome == 'success' && steps.preflight.outcome == 'success' }}
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File ./scripts/poc-sec01-03-rls-phase0.ps1

      - name: Phase 3 DEFINER EXECUTE PoC
        if: ${{ !cancelled() && steps.write_env.outcome == 'success' && steps.preflight.outcome == 'success' }}
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File ./scripts/poc-phase3-definer-execute.ps1

      - name: Always remove the ephemeral credential files
        if: always()
        shell: bash
        run: rm -f .env apps/api-server/.env
