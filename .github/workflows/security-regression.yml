name: Security regression

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  concurrency-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run build --workspace=@lantern/shared
      - name: Challenge + idempotency concurrency tests
        run: >
          npm test --workspace=@lantern/api-server --
          src/services/challengeService.test.ts
          src/services/idempotency.test.ts
          src/utils/concurrencyGate.test.ts

  security-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # THIS STEP FAILS THE JOB when the PoC credentials are missing.
      #
      # It used to set skip=true, warn, and pass green. Every PoC below was
      # skipped on every run for months while "Security regression: passing"
      # sat on the PR page — a green check that asserted nothing, which is
      # worse than no check at all, because people read it and believed it.
      #
      # Green now means the PoCs ran. If this step fails, either add the
      # secrets (docs/PIPELINE.md lists them by name) or delete this job — do
      # not restore the skip.
      - name: Required secrets are configured
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        shell: bash
        run: |
          missing=""
          [ -z "$VITE_SUPABASE_URL" ] && missing="$missing VITE_SUPABASE_URL"
          [ -z "$VITE_SUPABASE_ANON_KEY" ] && missing="$missing VITE_SUPABASE_ANON_KEY"
          [ -z "$SUPABASE_SERVICE_ROLE_KEY" ] && missing="$missing SUPABASE_SERVICE_ROLE_KEY"
          if [ -n "$missing" ]; then
            echo "::error::security-regression cannot run. Missing repository secrets:$missing"
            echo "Point these at a STAGING Supabase project, never production — the service-role key bypasses RLS,"
            echo "and this workflow runs on pull_request. See docs/PIPELINE.md § Secrets."
            exit 1
          fi
          echo "All PoC credentials present."

      - name: Write ephemeral .env for PoC scripts
        id: write_env
        shell: bash
        run: |
          cat > .env <<EOF
          VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_API_BASE_URL=${{ secrets.VITE_SUPABASE_API_BASE_URL }}
          EOF
          mkdir -p apps/api-server
          cat > apps/api-server/.env <<EOF
          SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          EOF

      - name: F-01 marketplace offers PoC
        if: ${{ !cancelled() && steps.write_env.outcome == 'success' }}
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File ./scripts/poc-f01-marketplace-offers.ps1

      # F-02 is the only PoC that calls the API server: it mints a JWT against
      # VITE_SUPABASE_URL and asks $VITE_API_BASE_URL to sign someone else's
      # private avatar. That host must serve the SAME Supabase project, so it
      # cannot be defaulted — a JWT from one project against another host 401s,
      # and the attacker probe would read as "blocked" while nothing was
      # blocked. Without the VITE_SUPABASE_API_BASE_URL secret this one step
      # fails with that message, and the five PoCs that talk only to PostgREST
      # still run and still prove what they prove.
      - name: F-02 profile avatar IDOR PoC
        if: ${{ !cancelled() && steps.write_env.outcome == 'success' }}
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File ./scripts/poc-f02-profile-avatar-idor.ps1

      - name: Auth-02 marketplace inquiries PoC
        if: ${{ !cancelled() && steps.write_env.outcome == 'success' }}
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File ./scripts/poc-auth02-marketplace-inquiries.ps1

      - name: RLS privilege battery
        if: ${{ !cancelled() && steps.write_env.outcome == 'success' }}
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File ./scripts/verify-rls-privileges.ps1

      - name: SEC-01/02/03 Phase 0 RLS PoC
        if: ${{ !cancelled() && steps.write_env.outcome == 'success' }}
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File ./scripts/poc-sec01-03-rls-phase0.ps1

      - name: Phase 3 DEFINER EXECUTE PoC
        if: ${{ !cancelled() && steps.write_env.outcome == 'success' }}
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File ./scripts/poc-phase3-definer-execute.ps1

      - name: Always remove the ephemeral credential files
        if: always()
        shell: bash
        run: rm -f .env apps/api-server/.env
