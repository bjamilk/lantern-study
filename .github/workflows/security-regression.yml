name: Security regression

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  concurrency-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run build --workspace=@lantern/shared
      - name: Challenge + idempotency concurrency tests
        run: >
          npm test --workspace=@lantern/api-server --
          src/services/challengeService.test.ts
          src/services/idempotency.test.ts
          src/utils/concurrencyGate.test.ts

  security-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # THIS STEP FAILS THE JOB when the PoC credentials are missing.
      #
      # It used to set skip=true, warn, and pass green. Every PoC below was
      # skipped on every run for months while "Security regression: passing"
      # sat on the PR page — a green check that asserted nothing, which is
      # worse than no check at all, because people read it and believed it.
      #
      # Green now means the PoCs ran. If this step fails, either add the
      # secrets (docs/PIPELINE.md lists them by name) or delete this job — do
      # not restore the skip.
      - name: Required secrets are configured
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        shell: bash
        run: |
          missing=""
          [ -z "$VITE_SUPABASE_URL" ] && missing="$missing VITE_SUPABASE_URL"
          [ -z "$VITE_SUPABASE_ANON_KEY" ] && missing="$missing VITE_SUPABASE_ANON_KEY"
          [ -z "$SUPABASE_SERVICE_ROLE_KEY" ] && missing="$missing SUPABASE_SERVICE_ROLE_KEY"
          if [ -n "$missing" ]; then
            echo "::error::security-regression cannot run. Missing repository secrets:$missing"
            echo "Point these at a STAGING Supabase project, never production — the service-role key bypasses RLS,"
            echo "and this workflow runs on pull_request. See docs/PIPELINE.md § Secrets."
            exit 1
          fi
          echo "All PoC credentials present."

      # The PoCs build every request as "$SupabaseUrl/rest/v1/..." or
      # "$SupabaseUrl/auth/v1/...", so VITE_SUPABASE_URL must be the project
      # ORIGIN. A secret holding the REST URL (https://<ref>.supabase.co/rest/v1)
      # makes the probe request /rest/v1/rest/v1/ and PostgREST answers 404
      # PGRST125 "Invalid path specified in request URL" -- a path error that
      # says nothing about credentials. Normalise here so one tidy-up fixes all
      # six scripts, and say so, so the secret itself gets tidied too.
      - name: Write ephemeral .env for PoC scripts
        id: write_env
        shell: bash
        env:
          RAW_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
        run: |
          url="$RAW_SUPABASE_URL"
          url="${url%/}"
          for suffix in /rest/v1 /auth/v1 /storage/v1 /realtime/v1 /functions/v1; do
            case "$url" in
              *"$suffix")
                url="${url%$suffix}"
                stripped="$suffix"
                ;;
            esac
          done
          url="${url%/}"
          if [ -n "${stripped:-}" ]; then
            echo "::notice title=VITE_SUPABASE_URL was normalised::The secret ends in '$stripped'. The PoCs append their own service paths, so it was stripped for this run. Please edit the secret to the bare project URL (https://<project-ref>.supabase.co) so the two cannot drift."
          fi
          # The normalised URL is not byte-identical to the secret, so GitHub's
          # automatic masking does not cover it and it printed in clear in the
          # next step's env block -- leaking the staging project ref into public
          # PR logs. Register it explicitly.
          echo "::add-mask::$url"
          echo "supabase_url=$url" >> "$GITHUB_OUTPUT"
          cat > .env <<EOF
          VITE_SUPABASE_URL=$url
          VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_API_BASE_URL=${{ secrets.VITE_SUPABASE_API_BASE_URL }}
          EOF
          if [ -n "${{ secrets.VITE_SUPABASE_API_BASE_URL }}" ]; then
            echo "has_api_base=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_api_base=false" >> "$GITHUB_OUTPUT"
          fi
          mkdir -p apps/api-server
          cat > apps/api-server/.env <<EOF
          SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          EOF

      # A wrong VITE_SUPABASE_URL is the failure mode that costs the most time:
      # the Supabase *dashboard* URL (https://supabase.com/dashboard/project/<ref>)
      # answers every /rest/v1 and /auth/v1 call with a 200 HTML page, so all six
      # PoCs die deep inside with "You cannot call a method on a null-valued
      # expression" or "expected denial, got status=200" -- which reads like a
      # real security failure and is not one. Diagnose it once, up front.
      # Diagnose the target and the keys before running anything against them.
      # Every earlier revision of this step guessed at one cause and named it
      # confidently; this one reports what it actually observed -- key formats,
      # which project each key is for, and which header combination is refused --
      # and only then gates. Nothing here prints a key.
      - name: Preflight - Supabase target and keys
        id: preflight
        shell: bash
        env:
          SUPABASE_URL: ${{ steps.write_env.outputs.supabase_url }}
          ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          url="${SUPABASE_URL%/}"
          case "$url" in
            */dashboard*|https://supabase.com*|https://www.supabase.com*)
              echo "::error::VITE_SUPABASE_URL is the Supabase dashboard URL, not the project API URL."
              echo "Use Settings > API > Project URL: https://<project-ref>.supabase.co"
              exit 1
              ;;
          esac

          # The project ref is the first host label. It is an identifier, not a
          # credential (it is in every client bundle), so it is safe to print --
          # and it is the only way to say *which* project a key belongs to.
          url_ref=$(printf '%s' "$url" | sed -E 's#^https?://([^.]+)\..*#\1#')
          echo "Project ref from VITE_SUPABASE_URL: $url_ref"

          # --- key formats (never the keys themselves) ---------------------
          classify() {
            case "$1" in
              eyJ*)              echo "legacy JWT" ;;
              sb_publishable_*)  echo "new-style publishable" ;;
              sb_secret_*)       echo "new-style secret" ;;
              "")                echo "EMPTY" ;;
              *)                 echo "unrecognised (not a Supabase key format)" ;;
            esac
          }
          anon_kind=$(classify "$ANON_KEY")
          service_kind=$(classify "$SERVICE_KEY")
          echo "VITE_SUPABASE_ANON_KEY format:     $anon_kind"
          echo "SUPABASE_SERVICE_ROLE_KEY format:  $service_kind"

          # A legacy JWT names its project in the `ref` claim. Decode only the
          # payload, read only `ref`, print only the comparison.
          jwt_ref() {
            payload=$(printf '%s' "$1" | cut -d. -f2 | tr '_-' '/+')
            case $(( ${#payload} % 4 )) in 2) payload="$payload==";; 3) payload="$payload=";; esac
            printf '%s' "$payload" | base64 -d 2>/dev/null \
              | sed -n 's/.*"ref"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' || true
          }
          ref_mismatch=0
          for pair in "VITE_SUPABASE_ANON_KEY:$anon_kind:$ANON_KEY" "SUPABASE_SERVICE_ROLE_KEY:$service_kind:$SERVICE_KEY"; do
            name="${pair%%:*}"; rest="${pair#*:}"; kind="${rest%%:*}"; key="${rest#*:}"
            if [ "$kind" = "legacy JWT" ]; then
              kref=$(jwt_ref "$key" || true)
              if [ -z "$kref" ]; then
                echo "$name: legacy JWT with no readable ref claim."
              elif [ "$kref" = "$url_ref" ]; then
                echo "$name: ref claim matches the project in VITE_SUPABASE_URL."
              else
                echo "::error::$name does not match: the key is for project $kref, but VITE_SUPABASE_URL is project $url_ref."
                ref_mismatch=1
              fi
            fi
          done

          # --- which header combination is refused -------------------------
          # The PoC scripts send BOTH `apikey` and `Authorization: Bearer` with
          # the anon key, so test the combinations separately: if only the Bearer
          # form fails, the key is fine and the scripts' header usage is the bug.
          hdr_probe() { # $1 url, $2 key, $3 mode
            case "$3" in
              apikey) curl -sS -o /tmp/pf.body -w '%{http_code}' -H "apikey: $2" "$1" || echo 000 ;;
              bearer) curl -sS -o /tmp/pf.body -w '%{http_code}' -H "Authorization: Bearer $2" "$1" || echo 000 ;;
              both)   curl -sS -o /tmp/pf.body -w '%{http_code}' -H "apikey: $2" -H "Authorization: Bearer $2" "$1" || echo 000 ;;
            esac
          }
          # An error body says which of two different things went wrong. The
          # distinction is the whole point: "Invalid API key" / a JWT error means
          # the key was REFUSED, while a Postgres SQLSTATE (42501 permission
          # denied, 42P01 undefined table) means the key was ACCEPTED and
          # PostgREST got as far as the database -- credentials fine, schema or
          # privileges incomplete. Reporting the second as the first sends people
          # to rotate a perfectly good key.
          verdict_of() {
            case "$1" in
              *'Invalid API key'*|*'No API key found'*|*'JWSError'*|*'JWTExpired'*|*'invalid JWT'*|*'bad_jwt'*)
                echo "KEY REFUSED" ;;
              *'"code":"42501"'*|*'permission denied'*)
                echo "credentials OK; missing GRANT (schema/privileges incomplete)" ;;
              *'"code":"42P01"'*|*'does not exist'*|*'PGRST205'*)
                echo "credentials OK; object missing (migrations incomplete)" ;;
              *'"code":"PGRST'*|*'"code":"4'*|*'"code":"5'*)
                echo "credentials OK; database-level error" ;;
              *) echo "" ;;
            esac
          }

          # INFORMATIONAL ONLY -- deliberately not a gate. See the verdict below:
          # anon being refused SELECT on a table is a statement about grants,
          # which is this suite's subject matter, not a statement about the key.
          anon_target="$url/rest/v1/marketplace_campuses?select=id&limit=1"
          echo "Anon key against $anon_target (project $url_ref):"
          for mode in apikey bearer both; do
            c=$(hdr_probe "$anon_target" "$ANON_KEY" "$mode")
            b=$(head -c 200 /tmp/pf.body 2>/dev/null || echo '')
            v=$(verdict_of "$b")
            echo "  mode '$mode': HTTP $c  -> ${v:-OK}"
            echo "    $b"
            eval "anon_$mode=\$c"
            # Quote inside the eval: a response body contains spaces and quotes,
            # and an unquoted assignment would word-split it into a syntax error.
            eval "anon_body_$mode=\"\$b\""
          done

          echo "Service-role key against <url>/auth/v1/admin/users (expect 200):"
          svc=$(curl -sS -o /tmp/pf.body -w '%{http_code}' \
            -H "apikey: $SERVICE_KEY" -H "Authorization: Bearer $SERVICE_KEY" \
            "$url/auth/v1/admin/users?per_page=1" || echo 000)
          echo "  HTTP $svc $(head -c 160 /tmp/pf.body 2>/dev/null)"

          # --- verdict -----------------------------------------------------
          if [ "$ref_mismatch" = "1" ]; then exit 1; fi

          case "$anon_kind" in
            "new-style publishable")
              if [ "${anon_bearer:-0}" = "401" ] && [ "${anon_apikey:-0}" != "401" ]; then
                echo "::error::VITE_SUPABASE_ANON_KEY is a new-style publishable key. It works in the apikey header but not as an Authorization Bearer token -- new-style keys are not JWTs -- and the PoC scripts send it as both."
                echo "Two ways out, both legitimate:"
                echo "  a) Give CI this project's LEGACY anon key (Settings > API > Legacy API keys; enable them if hidden)."
                echo "  b) Change the scripts to stop sending the anon key as a Bearer token. PostgREST needs only the apikey header for anon reads; user-scoped calls already carry the user's JWT from GoTrue, which is what the Authorization header is for."
                exit 1
              fi
              ;;
          esac

          # Is the anon KEY valid? That is a GoTrue question, not a PostgREST one.
          #
          # The previous revision gated on anon being able to SELECT
          # marketplace_campuses and failed the job when it could not. The body
          # said why: PostgreSQL 42501, "Grant the required privileges ... GRANT
          # SELECT ON public.marketplace_campuses". That is an authorisation
          # answer from an ACCEPTED key -- an unauthenticated request gets
          # "Invalid API key" or "No API key found" instead. Worse, anon having
          # no grant on that table is plausibly the CORRECT hardened state on a
          # project with the Phase 0 RLS migrations applied, and judging that is
          # the RLS battery's job, not the preflight's. A preflight that fails
          # the build for a security control working as intended is a preflight
          # that teaches people to ignore it.
          #
          # /auth/v1/settings is GoTrue's public endpoint: it answers 200 to any
          # valid anon key and 401 to an invalid one, with no grants involved.
          anon_settings=$(curl -sS -o /tmp/pf.body -w '%{http_code}' \
            -H "apikey: $ANON_KEY" "$url/auth/v1/settings" || echo 000)
          echo "Anon key against <url>/auth/v1/settings: HTTP $anon_settings"
          if [ "$anon_settings" != "200" ]; then
            echo "::error::VITE_SUPABASE_ANON_KEY was rejected by GoTrue (HTTP $anon_settings). The key itself is not valid for project $url_ref."
            head -c 300 /tmp/pf.body 2>/dev/null || true
            echo ""
            exit 1
          fi
          # The anon key was ACCEPTED above if the failure was a Postgres error
          # rather than an API-key error. Say so explicitly.
          anon_kind_verdict=$(verdict_of "${anon_body_both:-}")
          case "$anon_kind_verdict" in
            "KEY REFUSED")
              echo "::error::VITE_SUPABASE_ANON_KEY was refused by PostgREST. The key is not valid for project $url_ref."
              exit 1 ;;
            "") : ;;
            *) echo "Anon key against PostgREST: $anon_kind_verdict" ;;
          esac

          # ================= schema readiness =================
          # Separate from credentials, and labelled as such. These probes use the
          # SERVICE key, which bypasses RLS and holds every grant, so a failure
          # here is about the schema itself and nothing else.
          echo ""
          echo "=== Schema readiness on project $url_ref (service key; RLS bypassed) ==="
          ready=1
          check() { # $1 label, $2 path
            c=$(curl -sS -o /tmp/pf.body -w '%{http_code}' \
              -H "apikey: $SERVICE_KEY" -H "Authorization: Bearer $SERVICE_KEY" \
              "$url$2" || echo 000)
            b=$(head -c 200 /tmp/pf.body 2>/dev/null || echo '')
            case "$c" in
              2*) echo "  [ok]   $1" ;;
              *)  echo "  [FAIL] $1 -- HTTP $c"
                  echo "         $b"
                  ready=0 ;;
            esac
          }
          check "marketplace_campuses exists"            "/rest/v1/marketplace_campuses?select=id&limit=1"
          check "marketplace_campuses has an ACTIVE row" "/rest/v1/marketplace_campuses?select=id&active=eq.true&limit=1"
          check "marketplace_orders.payout_attempt"      "/rest/v1/marketplace_orders?select=payout_attempt&limit=0"
          check "marketplace_offers.proposed_by"         "/rest/v1/marketplace_offers?select=proposed_by&limit=0"
          check "marketplace_listings exists"            "/rest/v1/marketplace_listings?select=id&limit=0"
          check "profiles exists"                        "/rest/v1/profiles?select=id&limit=0"
          check "groups exists"                          "/rest/v1/groups?select=id&limit=0"
          check "dm_threads exists"                      "/rest/v1/dm_threads?select=id&limit=0"

          # An active campus row is seed data, not schema: PostgREST answers 200
          # with [] when the table is there but empty, so check the payload too.
          c=$(curl -sS -o /tmp/pf.body -w '%{http_code}' \
            -H "apikey: $SERVICE_KEY" -H "Authorization: Bearer $SERVICE_KEY" \
            "$url/rest/v1/marketplace_campuses?select=id&active=eq.true&limit=1" || echo 000)
          if [ "$c" = "200" ] && [ "$(head -c 200 /tmp/pf.body)" = "[]" ]; then
            echo "  [FAIL] marketplace_campuses has no active row (table exists, 0 rows)"
            echo "         F-01 and Auth-02 seed a listing against one. Re-apply"
            echo "         supabase/migrations/20260705120000_marketplace_location.sql."
            ready=0
          fi

          # Table count, for comparison with production. The OpenAPI document
          # lists one path per exposed table, so its key count is the table count.
          openapi=$(curl -sS -o /tmp/pf.openapi -w '%{http_code}' \
            -H "apikey: $SERVICE_KEY" -H "Authorization: Bearer $SERVICE_KEY" \
            "$url/rest/v1/" || echo 000)
          if [ "$openapi" = "200" ]; then
            n=$(jq -r '[.paths | keys[] | select(. != "/")] | length' /tmp/pf.openapi 2>/dev/null || echo '?')
            echo "  public tables/views exposed by PostgREST: $n  (compare with production)"
          else
            echo "  could not read the OpenAPI document (HTTP $openapi) -- table count unavailable"
          fi

          # anon grants are reported, never gated: anon lacking SELECT is very
          # possibly the hardening these PoCs exist to verify. The RLS battery
          # judges it; the preflight only says what it saw.
          echo "  anon SELECT on marketplace_campuses: ${anon_kind_verdict:-permitted}"

          if [ "$ready" != "1" ]; then
            echo "::error::Schema readiness FAILED on project $url_ref -- the item(s) marked [FAIL] above are missing. The staging project's migrations are incomplete, so the PoCs would fail for reasons unrelated to security. Re-apply the migrations, then check grants with: select table_name, privilege_type from information_schema.role_table_grants where grantee in ('anon','authenticated') order by 1;"
            exit 1
          fi

          echo "Preflight OK: project $url_ref reachable, both keys accepted."

      - name: F-01 marketplace offers PoC
        if: ${{ !cancelled() && steps.write_env.outcome == 'success' && steps.preflight.outcome == 'success' }}
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File ./scripts/poc-f01-marketplace-offers.ps1

      # F-02 is the only PoC that calls the API server: it mints a JWT against
      # VITE_SUPABASE_URL and asks $VITE_API_BASE_URL to sign someone else's
      # private avatar. That host must serve the SAME Supabase project, so it
      # cannot be defaulted — a JWT from one project against another host 401s,
      # and the attacker probe would read as "blocked" while nothing was
      # blocked.
      #
      # So when VITE_SUPABASE_API_BASE_URL is absent this step is SKIPPED, not
      # faked: it prints a ::warning:: annotation and writes a line into the job
      # summary saying, in as many words, that the avatar IDOR is NOT covered by
      # this run. It is never a silent pass. Set the secret and the step runs and
      # enforces again, with no other change. The five PoCs that talk only to
      # PostgREST run either way and still prove what they prove.
      - name: F-02 profile avatar IDOR PoC
        if: ${{ !cancelled() && steps.write_env.outcome == 'success' && steps.preflight.outcome == 'success' && steps.write_env.outputs.has_api_base == 'true' }}
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File ./scripts/poc-f02-profile-avatar-idor.ps1

      - name: F-02 profile avatar IDOR PoC (SKIPPED - no API target)
        if: ${{ !cancelled() && steps.write_env.outcome == 'success' && steps.preflight.outcome == 'success' && steps.write_env.outputs.has_api_base != 'true' }}
        shell: bash
        run: |
          echo "::warning title=F-02 avatar IDOR PoC SKIPPED::VITE_SUPABASE_API_BASE_URL is not set, so the profile-avatar IDOR proof did NOT run. This job being green does not mean F-02 is fixed."
          {
            echo "### :warning: F-02 profile avatar IDOR PoC was SKIPPED"
            echo ""
            echo "\`VITE_SUPABASE_API_BASE_URL\` is not configured, so this run did **not** test the"
            echo "private-avatar IDOR. It is the only PoC that needs a running API server; the other"
            echo "five talk to PostgREST directly and did run."
            echo ""
            echo "To restore coverage, set the \`VITE_SUPABASE_API_BASE_URL\` repository secret to an API"
            echo "server that serves the **same** Supabase project as \`VITE_SUPABASE_URL\`."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Auth-02 marketplace inquiries PoC
        if: ${{ !cancelled() && steps.write_env.outcome == 'success' && steps.preflight.outcome == 'success' }}
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File ./scripts/poc-auth02-marketplace-inquiries.ps1

      - name: RLS privilege battery
        if: ${{ !cancelled() && steps.write_env.outcome == 'success' && steps.preflight.outcome == 'success' }}
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File ./scripts/verify-rls-privileges.ps1

      - name: SEC-01/02/03 Phase 0 RLS PoC
        if: ${{ !cancelled() && steps.write_env.outcome == 'success' && steps.preflight.outcome == 'success' }}
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File ./scripts/poc-sec01-03-rls-phase0.ps1

      - name: Phase 3 DEFINER EXECUTE PoC
        if: ${{ !cancelled() && steps.write_env.outcome == 'success' && steps.preflight.outcome == 'success' }}
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File ./scripts/poc-phase3-definer-execute.ps1

      - name: Always remove the ephemeral credential files
        if: always()
        shell: bash
        run: rm -f .env apps/api-server/.env
