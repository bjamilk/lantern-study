# Lantern Study API — Render.com blueprint
# Connect repo: https://dashboard.render.com/blueprints
# Repo: bjamilk/lantern-study (branch: main)

services:
  - type: web
    name: lantern-study-gotenberg
    runtime: image
    plan: free
    region: oregon
    image:
      url: docker.io/gotenberg/gotenberg:8
    healthCheckPath: /health
    envVars:
      # Render assigns PORT (10000); Gotenberg defaults to 3000 without this.
      - key: API_PORT_FROM_ENV
        value: PORT

  - type: web
    name: lantern-study-api
    runtime: docker
    dockerfilePath: ./apps/api-server/Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    healthCheckPath: /health
    # Render's own git hook must NOT deploy this service. It used to, which
    # meant .github/workflows/deploy-api.yml — with its build, tests and
    # merge-provenance gate — was decoration: the API shipped from main with
    # zero checks while a red CI sat on the same commit. With auto-deploy off,
    # that workflow's Render API call is the only door.
    #
    # `autoDeployTrigger` is the current field; the older boolean `autoDeploy`
    # is deprecated. Quoted because unquoted `off` is boolean false in YAML 1.1.
    # ("checksPass" would let Render deploy on green CI by itself — not used
    # here, because the provenance gate must also pass.)
    #
    # THIS FILE ONLY TAKES EFFECT WHEN THE BLUEPRINT IS RE-APPLIED. Until then,
    # set Auto-Deploy to "No" by hand: Render dashboard -> lantern-study-api ->
    # Settings -> Build & Deploy. Note JWT_SECRET is generateValue:true, so
    # re-applying the blueprint ROTATES it and signs every live session out.
    autoDeployTrigger: "off"
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3001"
      - key: FRONTEND_URL
        value: https://lanternstudy.com
      # Canonical origin (SW / Sentry WEB-1W). This was the legacy
      # lantern-study.pages.dev alias; it is still in PRODUCTION_WEB_ORIGINS for
      # CORS, so nothing loses access, but no URL the API builds should name an
      # origin the browser's CSP does not allow.
      - key: WEB_APP_URL
        value: https://www.lanternstudy.com
      - key: REDIS_ENABLED
        value: "true"
      - key: REDIS_URL
        sync: false
      - key: GOTENBERG_URL
        value: https://lantern-study-gotenberg.onrender.com
      - key: ALLOW_DEV_AUTH_BYPASS
        value: "false"
      - key: ENABLE_MARKETPLACE_JOBS
        value: "true"
      - key: SUPABASE_URL
        value: https://tiizkjhbrnaibaagmurl.supabase.co
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: GROQ_API_KEY
        sync: false
      - key: FIREWORKS_API_KEY
        sync: false
      # Handwritten photo OCR (Perceive vision). Without this, /health.ai.gemini
      # stays "off" and photo notes fall back to Tesseract only.
      - key: GEMINI_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      # Paystack marketplace checkout: all three must be set for real payments
      # (see docs/RELEASING.md and the payments audit). sync:false on the flag
      # too, so a blueprint sync can never switch live checkout on by itself.
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: PAYSTACK_PUBLIC_KEY
        sync: false
      - key: MARKETPLACE_PAYSTACK_CHECKOUT
        sync: false
      - key: API_KEY_SALT_ROUNDS
        value: "12"
      - key: API_KEY_MAX_PER_USER
        value: "10"
      - key: API_KEY_DEFAULT_TTL_DAYS
        value: "0"
      - key: PUBLIC_READ_RATE_LIMIT_MAX
        value: "120"
      - key: PUBLIC_WRITE_RATE_LIMIT_MAX
        value: "10"
      - key: API_KEY_AUTH_RATE_LIMIT_MAX
        value: "20"
      - key: ANON_IP_RATE_LIMIT_MAX
        value: "300"
      - key: AUTHENTICATED_RATE_LIMIT_MAX
        value: "1200"
      - key: AI_POST_BURST_MAX
        value: "15"
      - key: UPLOAD_BURST_MAX
        value: "10"
      - key: BULLMQ_ENABLED
        value: "true"
      - key: ADMIN_RATE_LIMIT_MAX
        value: "300"
      - key: AI_DAILY_LIMIT
        value: "20"
      - key: AI_LIMIT_COMPANION
        value: "75"
      - key: AI_LIMIT_GENERATE_QUESTIONS
        value: "15"
      - key: AI_LIMIT_GENERATE_FLASHCARDS
        value: "15"
      - key: AI_LIMIT_EXPLAIN
        value: "40"
      - key: AI_LIMIT_STUDY_PLAN
        value: "10"
      - key: AI_LIMIT_ENHANCE_FLASHCARD
        value: "25"
      - key: AI_LIMIT_STUDY_RECOMMENDATIONS
        value: "25"
      # Concurrency / scale guards (per instance — raise only with larger plans + more replicas)
      - key: AI_MAX_INFLIGHT
        value: "16"
      - key: COMPANION_STREAM_MAX
        value: "32"
      - key: COMPANION_STREAM_TOKEN_DELAY_MS
        value: "0"
      - key: HTTP_MAX_CONNECTIONS
        value: "512"
      - key: HTTP_KEEP_ALIVE_TIMEOUT_MS
        value: "65000"
      - key: LOAD_SHED_HEAP_RATIO
        value: "0.92"

  - type: worker
    name: lantern-study-worker
    runtime: docker
    dockerfilePath: ./apps/api-server/Dockerfile
    dockerContext: .
    plan: starter
    region: oregon
    dockerCommand: node apps/api-server/dist/worker.js
    # Same reasoning as lantern-study-api above: the workflow is the only door.
    # The worker shares the API image, so an ungated auto-deploy here ships the
    # same untested commit by another route.
    autoDeployTrigger: "off"
    envVars:
      - key: NODE_ENV
        value: production
      - key: BULLMQ_ENABLED
        value: "true"
      - key: REDIS_ENABLED
        value: "true"
      - key: REDIS_URL
        sync: false
      - key: SUPABASE_URL
        value: https://tiizkjhbrnaibaagmurl.supabase.co
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: FIREWORKS_API_KEY
        sync: false
      # Handwritten photo OCR (Perceive vision). Without this, /health.ai.gemini
      # stays "off" and photo notes fall back to Tesseract only.
      - key: GEMINI_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      # Paystack marketplace checkout: all three must be set for real payments
      # (see docs/RELEASING.md and the payments audit). sync:false on the flag
      # too, so a blueprint sync can never switch live checkout on by itself.
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: PAYSTACK_PUBLIC_KEY
        sync: false
      - key: MARKETPLACE_PAYSTACK_CHECKOUT
        sync: false
      - key: ENABLE_MARKETPLACE_JOBS
        value: "true"
      - key: ENABLE_DATA_RETENTION_JOBS
        value: "true"
      # Parallel AI jobs on the worker (keep ≤ AI_MAX_INFLIGHT / provider budget)
      - key: AI_WORKER_CONCURRENCY
        value: "4"
      - key: AI_MAX_INFLIGHT
        value: "16"
      - key: FILE_WORKER_CONCURRENCY
        value: "1"
