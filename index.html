<!DOCTYPE html>
<html lang="en" class="">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lantern Study</title>
  <meta name="description" content="Collaborative study platform with flashcards, groups, and AI tools">
  <meta name="theme-color" content="#020617">
  <link rel="icon" href="/lantern-icon.png" type="image/png">
  <link rel="apple-touch-icon" href="/lantern-icon.png">
  <link rel="manifest" href="/manifest.json">
  <script>
    // Apply dark mode immediately based on localStorage or system preference
    if (localStorage.getItem('theme') === 'dark' || 
        (!localStorage.getItem('theme') && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      document.documentElement.classList.add('dark');
    }
    // Low-data default: system fonts only (Inter loaded dynamically when full mode)
    try {
      var ui = JSON.parse(localStorage.getItem('ui-storage') || '{}');
      if (ui.state && ui.state.lowDataMode === false) {
        document.documentElement.classList.add('font-full');
      }
    } catch (e) {}
  </script>
</head>
<body class="bg-lantern-background text-lantern-text transition-colors duration-300 antialiased">
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
