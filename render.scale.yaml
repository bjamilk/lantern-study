# SCALE BLUEPRINT — not the live free/starter deploy.
# Copy env secrets from production before applying.
# See docs/deploy/100k-capacity-plan.md

services:
  - type: web
    name: lantern-study-gotenberg
    runtime: image
    plan: starter
    region: oregon
    image:
      url: docker.io/gotenberg/gotenberg:8
    healthCheckPath: /health
    envVars:
      - key: API_PORT_FROM_ENV
        value: PORT

  - type: web
    name: lantern-study-api
    runtime: docker
    dockerfilePath: ./apps/api-server/Dockerfile
    dockerContext: .
    plan: standard
    region: oregon
    numInstances: 4
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3001"
      - key: FRONTEND_URL
        value: https://lanternstudy.com
      - key: WEB_APP_URL
        value: https://lantern-study.pages.dev
      - key: REDIS_ENABLED
        value: "true"
      - key: REDIS_URL
        sync: false
      - key: GOTENBERG_URL
        value: https://lantern-study-gotenberg.onrender.com
      - key: ALLOW_DEV_AUTH_BYPASS
        value: "false"
      - key: ENABLE_MARKETPLACE_JOBS
        value: "true"
      - key: BULLMQ_ENABLED
        value: "true"
      - key: SUPABASE_URL
        value: https://tiizkjhbrnaibaagmurl.supabase.co
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: FIREWORKS_API_KEY
        sync: false
      # Paystack marketplace checkout: all three must be set for real payments
      # (see docs/RELEASING.md and the payments audit). sync:false on the flag
      # too, so a blueprint sync can never switch live checkout on by itself.
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: PAYSTACK_PUBLIC_KEY
        sync: false
      - key: MARKETPLACE_PAYSTACK_CHECKOUT
        sync: false
      - key: PUBLIC_READ_RATE_LIMIT_MAX
        value: "120"
      - key: PUBLIC_WRITE_RATE_LIMIT_MAX
        value: "10"
      - key: ANON_IP_RATE_LIMIT_MAX
        value: "300"
      - key: AUTHENTICATED_RATE_LIMIT_MAX
        value: "1200"
      - key: AI_POST_BURST_MAX
        value: "15"
      - key: UPLOAD_BURST_MAX
        value: "10"
      - key: ADMIN_RATE_LIMIT_MAX
        value: "300"
      - key: AI_DAILY_LIMIT
        value: "20"
      - key: AI_MAX_INFLIGHT
        value: "24"
      - key: COMPANION_STREAM_MAX
        value: "48"
      - key: HTTP_MAX_CONNECTIONS
        value: "1024"
      - key: HTTP_KEEP_ALIVE_TIMEOUT_MS
        value: "65000"
      - key: LOAD_SHED_HEAP_RATIO
        value: "0.90"

  - type: worker
    name: lantern-study-worker
    runtime: docker
    dockerfilePath: ./apps/api-server/Dockerfile
    dockerContext: .
    plan: standard
    region: oregon
    numInstances: 2
    dockerCommand: node apps/api-server/dist/worker.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: BULLMQ_ENABLED
        value: "true"
      - key: REDIS_ENABLED
        value: "true"
      - key: REDIS_URL
        sync: false
      - key: SUPABASE_URL
        value: https://tiizkjhbrnaibaagmurl.supabase.co
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: FIREWORKS_API_KEY
        sync: false
      # Paystack marketplace checkout: all three must be set for real payments
      # (see docs/RELEASING.md and the payments audit). sync:false on the flag
      # too, so a blueprint sync can never switch live checkout on by itself.
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: PAYSTACK_PUBLIC_KEY
        sync: false
      - key: MARKETPLACE_PAYSTACK_CHECKOUT
        sync: false
      - key: ENABLE_MARKETPLACE_JOBS
        value: "true"
      - key: ENABLE_DATA_RETENTION_JOBS
        value: "true"
      - key: AI_WORKER_CONCURRENCY
        value: "8"
      - key: AI_MAX_INFLIGHT
        value: "24"
      - key: FILE_WORKER_CONCURRENCY
        value: "2"
      - key: EXPORT_WORKER_CONCURRENCY
        value: "2"
